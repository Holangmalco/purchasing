name: Keep Streamlit Alive

on:
  schedule:
    # 6시간마다 실행 (UTC 기준 00:00, 06:00, 12:00, 18:00)
    - cron: "0 */6 * * *"
  # GitHub Actions 탭에서 언제든지 수동 실행 가능
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Visit and wake Streamlit App
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');

          (async () => {
            console.log('========================================');
            console.log('🚀 Streamlit Keep-Alive Process Starting');
            console.log('========================================');

            const browser = await chromium.launch({
              headless: true
            });

            const context = await browser.newContext({
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36',
              viewport: { width: 1920, height: 1080 }
            });

            const page = await context.newPage();

            const APP_URL = 'https://iacf-purchasing.streamlit.app/';

            try {
              console.log(`[1] Navigating to ${APP_URL}...`);
              await page.goto(APP_URL, {
                waitUntil: 'domcontentloaded',
                timeout: 90000
              });

              // 초기 로딩 대기
              await page.waitForTimeout(5000);
              console.log('Page DOM content loaded.');

              // ========================================
              // 2. Sleep 상태 감지 및 Wake-up 버튼 클릭
              // ========================================
              console.log('[2] Checking if app is in sleep mode...');

              // Streamlit Cloud의 "Yes, get this app back up!" 버튼 찾기 (대소문자 무시)
              const wakeButton = page.locator('button:has-text("get this app back up"), button:has-text("Yes, get this app back up!")');
              const wakeCount = await wakeButton.count();

              if (wakeCount > 0 && await wakeButton.first().isVisible()) {
                console.log('⚠️ [SLEEP DETECTED] Wake-up button found. Clicking to wake app...');
                await wakeButton.first().click({ timeout: 15000 });
                console.log('Wake-up button clicked. Waiting for app to boot (up to 90s)...');
                await page.waitForTimeout(15000);
              } else {
                console.log('✅ App does not appear to be sleeping (or already awake).');
              }

              // ========================================
              // 3. 메인 콘텐츠 및 Streamlit 앱 준비 대기
              // ========================================
              console.log('[3] Waiting for Streamlit main frame/elements...');
              try {
                // Streamlit 메인 앱 컨테이너 또는 네비게이션이 뜰 때까지 대기
                await page.waitForSelector('[data-testid="stAppViewContainer"], header, .stApp', {
                  state: 'attached',
                  timeout: 60000
                });
                console.log('Streamlit core container detected.');
              } catch (e) {
                console.log('Note: Core container selector timeout, proceeding with interaction...');
              }

              await page.waitForTimeout(5000);

              // ========================================
              // 4. 네비게이션 및 메뉴 상호작용 (세션 유지)
              // ========================================
              console.log('[4] Interacting with page to keep session active...');

              // 상단 메뉴 "구매/계약" 탭 클릭 시도
              try {
                const purchaseTab = page.locator('text=/구매\\/계약/').first();
                if (await purchaseTab.isVisible({ timeout: 10000 })) {
                  await purchaseTab.click({ timeout: 10000 });
                  console.log('Successfully navigated to [구매/계약] page.');
                  await page.waitForTimeout(4000);
                }
              } catch (err) {
                console.log('Navigation to [구매/계약] skipped or already active:', err.message);
              }

              // 사이드바 내부 라디오 메뉴 항목 클릭 시도 (이모지 유무 무관하게 유연한 정규식 매칭)
              const targetMenus = [/구매요청/, /구매계약/, /불러오기/, /재산증감/];
              const randomTarget = targetMenus[Math.floor(Math.random() * targetMenus.length)];

              try {
                const menuItem = page.locator(`text=${randomTarget}`).first();
                if (await menuItem.isVisible({ timeout: 5000 })) {
                  await menuItem.click({ timeout: 5000 });
                  console.log(`Clicked menu matching ${randomTarget}`);
                }
              } catch (e) {
                console.log('Submenu click skipped:', e.message);
              }

              // 세션 유지를 위해 가벼운 스크롤 동작
              await page.mouse.wheel(0, 300);
              await page.waitForTimeout(3000);
              await page.mouse.wheel(0, -300);
              await page.waitForTimeout(5000);

              console.log('========================================');
              console.log('🎉 KEEP-ALIVE SESSION REFRESHED SUCCESSFULLY!');
              console.log('========================================');

            } catch (error) {
              console.error('⚠️ Warning during keep-alive execution:', error.message);
              // 앱 페이지 접속 시도가 이루어졌다면 스케줄 비활성화를 방지하기 위해 정상 종료
            } finally {
              await browser.close();
              console.log('Browser closed.');
            }
          })();
          EOF