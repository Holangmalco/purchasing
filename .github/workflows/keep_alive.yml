name: Keep Streamlit Alive

on:
  schedule:
    # 6시간마다 실행 (UTC 기준 00:00, 06:00, 12:00, 18:00)
    - cron: "0 */6 * * *"
  # GitHub Actions 탭에서 언제든지 수동 실행 가능
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Visit and wake Streamlit App
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');

          (async () => {
            console.log('========================================');
            console.log('🚀 Streamlit Keep-Alive Process Starting');
            console.log('========================================');

            const browser = await chromium.launch({
              headless: true
            });

            const context = await browser.newContext({
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36',
              viewport: { width: 1920, height: 1080 }
            });

            const page = await context.newPage();
            const APP_URL = 'https://iacf-purchasing.streamlit.app/';

            try {
              // ----------------------------------------
              // 1. 앱 페이지 접속
              // ----------------------------------------
              console.log(`[1] Navigating to ${APP_URL}...`);
              await page.goto(APP_URL, {
                waitUntil: 'domcontentloaded',
                timeout: 90000
              });

              // 초기 로딩 대기
              await page.waitForTimeout(5000);
              console.log(`Page loaded. Current URL: ${page.url()}`);

              // ----------------------------------------
              // 2. Sleep 상태 감지 및 Wake-up 버튼 클릭
              // ----------------------------------------
              console.log('[2] Checking if app is in sleep mode...');
              const wakeButton = page.locator('button:has-text("get this app back up"), button:has-text("Yes, get this app back up!"), button:has-text("Wake up")');

              if (await wakeButton.count() > 0 && await wakeButton.first().isVisible()) {
                console.log('⚠️ [SLEEP DETECTED] Wake-up button found. Clicking to wake app...');
                await wakeButton.first().click({ timeout: 15000 });
                console.log('Wake-up button clicked. Waiting for container to boot (30s)...');
                await page.waitForTimeout(30000);
              } else {
                console.log('✅ App does not appear to be sleeping (already awake).');
              }

              // ----------------------------------------
              // 3. Streamlit 앱 iframe 및 메인 콘텐츠 감지
              // ----------------------------------------
              console.log('[3] Detecting Streamlit app frame...');
              
              // Streamlit Cloud는 실제 앱을 iframe 안에 로드합니다.
              const iframeLocator = page.frameLocator('iframe[title="streamlitApp"], iframe').first();
              let targetContext = page; // iframe이 없거나 직접 로드된 경우 대비 fallback

              try {
                // iframe 내부의 메인 컨테이너 대기 (최대 15초)
                await iframeLocator.locator('[data-testid="stAppViewContainer"], .stApp, header').first().waitFor({
                  state: 'attached',
                  timeout: 15000
                });
                console.log('✅ Streamlit app detected inside iframe.');
                targetContext = iframeLocator;
              } catch (e) {
                // iframe이 없거나 직접 렌더링된 경우 최상위 페이지에서 대기 시도
                try {
                  await page.locator('[data-testid="stAppViewContainer"], .stApp, header').first().waitFor({
                    state: 'attached',
                    timeout: 5000
                  });
                  console.log('✅ Streamlit app detected in top page.');
                } catch (err) {
                  console.log('ℹ️ Core container not immediately detected (proceeding anyway, visit ping registered).');
                }
              }

              // ----------------------------------------
              // 4. 가벼운 메뉴 인터랙션 (활성 세션 핑)
              // ----------------------------------------
              console.log('[4] Performing keep-alive interactions...');
              try {
                // 메뉴 클릭 시도 (구매추출기, 구매계약관리 등)
                const navItem = targetContext.locator('text=/구매추출기|구매계약관리|구매\\/계약|재산증감|홈/').first();
                if (await navItem.isVisible({ timeout: 5000 })) {
                  await navItem.click({ timeout: 5000 });
                  console.log('Navigated menu item successfully.');
                  await page.waitForTimeout(3000);
                }
              } catch (e) {
                console.log('Menu interaction skipped:', e.message);
              }

              // 스크롤 동작으로 브라우저 활성 상태 전달
              await page.mouse.wheel(0, 200);
              await page.waitForTimeout(2000);
              await page.mouse.wheel(0, -200);

              // 세션 유지 대기
              console.log('Maintaining active session for 10 seconds...');
              await page.waitForTimeout(10000);

              console.log('========================================');
              console.log('🎉 KEEP-ALIVE COMPLETED SUCCESSFULLY!');
              console.log('========================================');

            } catch (error) {
              // 방문 시도 자체가 이루어졌다면 워크플로우를 실패시키지 않고 경고만 출력
              console.warn('⚠️ Non-fatal notice during keep-alive run:', error.message);
            } finally {
              await browser.close();
              console.log('Browser closed cleanly.');
            }
          })();
          EOF